<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 1000" width="1500" height="1000">
  <title>A roof in section: shingles, underlayment, ice-and-water membrane, decking, rafter, attic insulation, soffit vent and gutter</title>
  <defs>
    <pattern id="sh" width="96" height="30" patternUnits="userSpaceOnUse">
      <rect width="96" height="30" fill="#1c2226"/>
      <rect x="0" y="2" width="60" height="12" fill="#3a4247"/>
      <rect x="62" y="2" width="34" height="12" fill="#353d42"/>
      <rect x="30" y="16" width="60" height="12" fill="#3f484d"/>
      <rect x="-4" y="16" width="32" height="12" fill="#353d42"/>
      <rect x="92" y="16" width="20" height="12" fill="#3a4247"/>
    </pattern>
    <clipPath id="attic"><path d="M0 271 L1150 784 L1150 790 L0 790 Z"/></clipPath>
  </defs>

  <!-- sky and rain -->
  <rect width="1500" height="1000" fill="#1a1f22"/>
  <g fill="#9fc2f0" opacity=".4">
    <rect x="300" y="40" width="3" height="40"/><rect x="420" y="120" width="3" height="40"/><rect x="560" y="30" width="3" height="40"/>
    <rect x="700" y="160" width="3" height="40"/><rect x="840" y="60" width="3" height="40"/><rect x="980" y="220" width="3" height="40"/>
    <rect x="1120" y="110" width="3" height="40"/><rect x="1260" y="280" width="3" height="40"/><rect x="1400" y="160" width="3" height="40"/>
    <rect x="1340" y="420" width="3" height="40"/><rect x="1440" y="520" width="3" height="40"/><rect x="1200" y="20" width="3" height="40"/>
  </g>

  <!-- the house below the ceiling -->
  <rect x="0" y="830" width="1150" height="170" fill="#c9d2cf"/>
  <rect x="0" y="830" width="1150" height="14" fill="#aebab6"/>
  <rect x="160" y="880" width="180" height="120" fill="#f3f5f4"/>
  <rect x="246" y="880" width="8" height="120" fill="#aebab6"/>

  <!-- attic: dark space, insulation, ceiling joist -->
  <path d="M0 271 L1150 784 L1150 790 L0 790 Z" fill="#0b0e0f"/>
  <g clip-path="url(#attic)">
    <path d="M0 790 V735 c30-22 60-22 90 0 c30-22 60-22 90 0 c30-22 60-22 90 0 c30-22 60-22 90 0 c30-22 60-22 90 0 c30-22 60-22 90 0 c30-22 60-22 90 0 c30-22 60-22 90 0 c30-22 60-22 90 0 c30-22 60-22 90 0 c30-22 60-22 90 0 c30-22 60-22 90 0 c30-22 60-22 90 0 V790 Z" fill="#dfe5e2"/>
    <g fill="#c9d2cf"><circle cx="70" cy="760" r="6"/><circle cx="250" cy="770" r="5"/><circle cx="430" cy="758" r="6"/><circle cx="610" cy="772" r="5"/><circle cx="790" cy="762" r="6"/><circle cx="970" cy="768" r="5"/></g>
    <rect x="300" y="330" width="16" height="460" fill="#4a3b2c"/>
    <rect x="700" y="510" width="16" height="280" fill="#4a3b2c"/>
  </g>
  <rect x="0" y="790" width="1150" height="40" fill="#5b4a37"/>
  <rect x="0" y="790" width="1150" height="8" fill="#6b5842"/>

  <!-- wall and top plate -->
  <rect x="1150" y="760" width="40" height="240" fill="#6b5842"/>
  <rect x="1190" y="760" width="40" height="240" fill="#4d6a3c"/>
  <g fill="#3f5a31"><rect x="1190" y="800" width="40" height="4"/><rect x="1190" y="840" width="40" height="4"/><rect x="1190" y="880" width="40" height="4"/><rect x="1190" y="920" width="40" height="4"/><rect x="1190" y="960" width="40" height="4"/></g>

  <!-- soffit with vent slots -->
  <rect x="1230" y="742" width="160" height="16" fill="#8b969a"/>
  <g fill="#1a1f22"><rect x="1260" y="747" width="20" height="6"/><rect x="1290" y="747" width="20" height="6"/><rect x="1320" y="747" width="20" height="6"/><rect x="1350" y="747" width="20" height="6"/></g>

  <!-- the roof, built along the slope -->
  <g transform="translate(60 130) rotate(24)">
    <!-- rafter -->
    <rect x="-80" y="44" width="1520" height="110" fill="#5b4a37"/>
    <rect x="-80" y="44" width="1520" height="14" fill="#6b5842"/>
    <!-- decking with sheet joints -->
    <rect x="-80" y="18" width="1540" height="26" fill="#9c7b55"/>
    <g fill="#7d6244"><rect x="160" y="18" width="3" height="26"/><rect x="400" y="18" width="3" height="26"/><rect x="640" y="18" width="3" height="26"/><rect x="880" y="18" width="3" height="26"/><rect x="1120" y="18" width="3" height="26"/><rect x="1360" y="18" width="3" height="26"/></g>
    <!-- underlayment over the whole deck -->
    <rect x="-80" y="2" width="1550" height="16" fill="#c9d2cf"/>
    <!-- ice-and-water membrane at the eave -->
    <rect x="1040" y="10" width="430" height="8" fill="#0e1113"/>
    <!-- shingles -->
    <rect x="-80" y="-30" width="1560" height="32" fill="url(#sh)"/>
    <g fill="#8b969a"><rect x="200" y="-34" width="10" height="4"/><rect x="520" y="-34" width="10" height="4"/><rect x="840" y="-34" width="10" height="4"/><rect x="1160" y="-34" width="10" height="4"/></g>
    <!-- drip edge -->
    <rect x="1460" y="-32" width="14" height="80" fill="#a7b0b3"/>
    <!-- a few drops running down -->
    <g fill="#9fc2f0"><rect x="400" y="-44" width="18" height="6"/><rect x="900" y="-44" width="18" height="6"/><rect x="1300" y="-44" width="18" height="6"/></g>
  </g>

  <!-- ridge vent cap -->
  <path d="M0 74 L120 74 L150 104 L0 104 Z" fill="#8b969a"/>
  <path d="M0 104 L150 104 L160 118 L0 118 Z" fill="#5b666b"/>
  <g fill="#1a1f22"><rect x="20" y="108" width="14" height="6"/><rect x="50" y="108" width="14" height="6"/><rect x="80" y="108" width="14" height="6"/><rect x="110" y="108" width="14" height="6"/></g>

  <!-- gutter with water -->
  <path d="M1388 726 H1490 V790 Q1490 810 1470 810 H1406 Q1388 810 1388 792 Z" fill="#a7b0b3"/>
  <rect x="1398" y="760" width="82" height="40" fill="#3d8bf2"/>
  <rect x="1398" y="760" width="82" height="6" fill="#7fb0f5"/>
  <rect x="1440" y="810" width="30" height="190" fill="#8b969a"/>
  <rect x="1440" y="810" width="8" height="190" fill="#a7b0b3"/>
</svg>
