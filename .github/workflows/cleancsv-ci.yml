name: CleanCSV CI

on:
  pull_request:
    paths: ['cleancsv/**', '.github/workflows/cleancsv-ci.yml']
  push:
    branches: [main]
    paths: ['cleancsv/**', '.github/workflows/cleancsv-ci.yml']

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: cleancsv
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: cleancsv/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          CI: 'true'
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results
          path: cleancsv/test-results
          retention-days: 7
